<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Anything Goes Archive{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anything Goes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#ff4500">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script>
    var savedTheme = localStorage.getItem('aga_theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme ? savedTheme === 'dark' : prefersDark) document.documentElement.classList.add('dark');
    if (localStorage.getItem('aga_wider_width') === 'true') document.documentElement.classList.add('wide');
    if (localStorage.getItem('aga_hide_flairs') === 'true') document.documentElement.classList.add('hide-flairs');
    var savedTallHeader = localStorage.getItem('aga_tall_header');
    if (savedTallHeader ? savedTallHeader === 'true' : window.navigator.standalone === true) document.documentElement.classList.add('tall-header');
    var ts = localStorage.getItem('aga_text_size');
    if (ts === 'small') document.documentElement.classList.add('text-small');
    if (ts === 'large') document.documentElement.classList.add('text-large');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo">
        <img src="/static/icon.png" alt="Anything Goes Archive" class="site-icon">
      </a>
      <form class="search-form" action="/search" method="get">
        <div class="search-input-wrap">
          <input type="search" name="q" placeholder="Search comments…" value="{{ request.query_params.get('q', '') }}" id="search-input" autocomplete="off">
          <kbd class="search-shortcut">/</kbd>
          <div class="search-suggestions" id="search-suggestions"></div>
        </div>
        <button type="submit" class="icon-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </form>
      <div class="header-actions">
        <a href="/saved" class="header-btn icon-btn" aria-label="Saved Comments">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>
        <a href="/settings" class="header-btn icon-btn" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  <div class="author-summary-overlay" id="author-summary-overlay" onclick="if (event.target === this) closeAuthorSummary()">
    <div class="author-summary-panel" id="author-summary-panel" role="dialog" aria-modal="true"></div>
  </div>
  <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
