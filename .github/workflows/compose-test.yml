# https://github.com/peter-evans/docker-compose-actions-workflow

name: Test Docker Compose Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 22 * * 3'
  workflow_dispatch:

jobs:
  test:
    name: Validate Stack with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build --load -t ghcr.io/wazam/r-fantasybaseball-indexer:latest .

      - name: Create data directory
        run: mkdir -p data

      - name: Start web service
        run: |
          REDDIT_CLIENT_ID=test \
          REDDIT_CLIENT_SECRET=test \
          docker compose up -d web

      - name: Wait for web service
        run: sleep 30

      - name: Verify web UI is responding
        run: curl --retry 10 --retry-connrefused --fail http://localhost:9009/

      - name: Teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
