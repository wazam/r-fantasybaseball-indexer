# Compose Test's hardened run merges this over compose.yaml; its plain run uses compose.yaml alone
services:
  anything-goes-archive:
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m
